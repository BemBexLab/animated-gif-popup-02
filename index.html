<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title></title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5" defer></script>
    <script src="./popup.js?v=20261128-tailwind" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
      defer
    ></script>
  </head>
  <body x-data="wurizipPopup" class="group min-h-dvh bg-white font-[Arial,sans-serif] text-base leading-[1.5] text-black
    [&_button]:cursor-pointer [&_button:focus-visible]:outline-2 [&_button:focus-visible]:outline-offset-[3px]
    [&_button:focus-visible]:outline-[#008bd2]">
    <template x-if="loadError">
      <p role="alert" class="fixed right-6 bottom-6 max-w-xs rounded-xl border border-[#ffc9c9] bg-white p-4 text-[14px] text-[#c10007]" x-text="loadError"></p>
    </template>

    <template x-if="isOpen">
      <aside
        x-ref="popupAnchor"
        :data-step="step"
        :style="layoutStyle"
        class="group/popup fixed right-[max(8px,env(safe-area-inset-right))]
          bottom-[max(8px,env(safe-area-inset-bottom))] z-50 @container w-[min(712px,calc(100vw-16px))]
          max-w-[calc(100vw-max(8px,env(safe-area-inset-left))-max(8px,env(safe-area-inset-right)))] lg:right-4
          lg:bottom-4 lg:w-[min(712px,calc(100vw-32px))]
          [@media(max-height:500px)]:max-w-[min(520px,calc(100vw-32px))] [--stage-unit:calc(100cqw/712)]"
        :aria-label="content.accessibility.assistant"
        @keydown.escape="closePopup()"
      >
        <button
          x-show="step > 1"
          type="button"
          class="absolute top-(--control-y) z-30 grid size-11 place-items-center rounded-full bg-white/65
            text-[#008bd2] backdrop-blur-[10px] group-data-compact:top-0 group-data-compact:left-auto
            left-[calc(var(--close-x)-44*var(--stage-unit))] group-data-compact:right-[calc(2%+44px)]"
          @click="goBack()"
          aria-label="Go back"
        >
          <svg class="size-5 fill-none stroke-current stroke-[2.5] [stroke-linecap:round] [stroke-linejoin:round]
            translate-x-2" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M12 4 6 10l6 6" />
          </svg>
        </button>
        <button
          type="button"
          class="popup-close absolute top-(--control-y) z-30 grid size-11 place-items-center rounded-full bg-white/65
            text-[#008bd2] backdrop-blur-[10px] group-data-compact:top-0 group-data-compact:left-auto
            left-(--close-x) group-data-compact:right-[2%]"
          @click="closePopup()"
          aria-label="Close Wurizip"
        >
          <svg class="size-5 fill-none stroke-current stroke-[2.5] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 20 20" aria-hidden="true">
            <path d="m6 6 8 8M14 6l-8 8" />
          </svg>
        </button>
        <section
          x-ref="popupViewport"
          class="relative aspect-[712/536]
            max-h-[calc(100dvh-max(16px,env(safe-area-inset-top))-max(16px,env(safe-area-inset-bottom)))]
            overflow-x-hidden overflow-y-auto overscroll-contain group-data-[step=5]/popup:aspect-auto
            group-data-compact:aspect-auto group-data-compact:rounded-[32px] group-data-compact:pb-14"
          role="region"
          :aria-label="content.accessibility.conversation"
        >
          <div class="relative aspect-[712/536] translate-x-(--stage-offset) group-data-compact:aspect-auto
            group-data-compact:translate-x-0">
            <!-- Render the glass at the document level so the popup's stacking context does not block backdrop sampling. -->
            <template x-teleport="body">
              <div
                class="pointer-events-none fixed top-(--glass-top) left-(--glass-left) z-49 h-(--glass-height)
                  w-(--glass-width) bg-[#b2e3fa]/55 backdrop-blur-[16px] backdrop-saturate-[1.4]
                  [clip-path:url(#glass-clip)] group-data-compact:rounded-[32px] group-data-compact:bg-white/40
                  group-data-compact:[clip-path:none]"
                :style="glassStyle"
                aria-hidden="true"
              ></div>
            </template>
            <svg
              class="pointer-events-none absolute inset-0 size-full group-data-compact:hidden"
              viewBox="0 0 712 536"
              aria-hidden="true"
            >
              <defs>
                <clipPath id="glass-clip" clipPathUnits="objectBoundingBox">
                  <path
                    :d="bubblePath"
                    :transform="bubbleClipTransform"
                  />
                </clipPath>
                <filter
                  id="bubble-edge"
                  x="-5%"
                  y="-5%"
                  width="110%"
                  height="110%"
                >
                  <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.7"
                    numOctaves="2"
                    seed="8"
                    result="noise"
                  />
                  <feDisplacementMap
                    in="SourceGraphic"
                    in2="noise"
                    scale="3"
                    xChannelSelector="R"
                    yChannelSelector="G"
                  />
                </filter>
              </defs>
              <path
                :d="bubblePath"
                :transform="bubbleTransform"
                fill="none"
                stroke="#008bd2"
                stroke-width="3"
                stroke-linejoin="round"
                filter="url(#bubble-edge)"
              />
              <path
                :d="bubblePath"
                :transform="bubbleTransform"
                fill="none"
                stroke="#008bd2"
                stroke-width="3.5"
                stroke-dasharray="1 3"
                stroke-linecap="round"
              />
            </svg>
            <span
              class="absolute top-(--control-y) left-(--badge-x) z-10 grid size-[6cqw] place-items-center
                rounded-full bg-[#83b34f] text-[4.2cqw] leading-none font-bold text-white
                group-data-compact:top-2 group-data-compact:left-6 group-data-compact:size-9
                group-data-compact:text-2xl/none"
              x-text="step"
              :aria-label="content.accessibility.currentStep"
            ></span>

            <div
              x-ref="stepTitle"
              tabindex="-1"
              class="absolute top-(--text-y) left-(--bubble-x) w-[84%] -translate-1/2 text-center text-[3.09cqw]
                leading-[1.2] outline-none [&_p+p]:mt-[0.25cqw] group-data-compact:relative
                group-data-compact:inset-auto group-data-compact:mx-auto group-data-compact:w-fit
                group-data-compact:max-w-[calc(100%-16px)] group-data-compact:translate-0
                group-data-compact:rounded-[36px] group-data-compact:border-3 group-data-compact:border-dotted
                group-data-compact:border-[#008bd2] group-data-compact:bg-[#b2e3fa]/55
                group-data-compact:px-[clamp(12px,4vw,20px)] group-data-compact:text-base/6
                group-data-compact:[&_p+p]:mt-1.5"
              :class="step === 2 ? 'group-data-compact:py-[34px]' : 'group-data-compact:pt-12 group-data-compact:pb-5'"
              aria-live="polite"
              aria-atomic="true"
            >
              <span aria-hidden="true" class="pointer-events-none absolute -bottom-[66px] left-[calc(clamp(72px,27vw,104px)*0.6-2px)] hidden size-8 rotate-45 border-r-3 border-b-3 border-dotted border-[#008bd2] bg-[#b2e3fa]/55 group-data-compact:block"></span>
              <div x-show="step === 1">
                <p>Hi, I’m Wurizip,<br />your Opustown companion.</p>
                <p>
                  Would you like to know the C-Index<br class="group-data-compact:hidden" />
                  of the project you visited?
                </p>
              </div>
              <div x-show="step === 2">
                <p class="pt-[max(0px,calc((44px-1lh)/2))]">Which index would you like to know?</p>
                <div class="index-choices mx-auto mt-[1cqw] flex max-w-[70%] flex-wrap justify-center gap-x-[3.5cqw]
                  gap-y-[0.5cqw] group-data-compact:mt-3 group-data-compact:max-w-full
                  group-data-compact:gap-x-5 group-data-compact:gap-y-1">
                  <template x-for="index in content.indices" :key="index.id">
                    <button
                      type="button"
                      class="flex min-h-11 items-center gap-[1.2cqw] group-data-compact:gap-2"
                      @click="chooseIndex(index.id)"
                      :title="index.name"
                      :aria-label="index.shortName + ' (' + index.name + ')'"
                    >
                      <span class="size-[3.35cqw] rounded-full border-2 border-dotted border-[#00b5ff]
                        group-data-compact:size-6 group-data-compact:shrink-0" aria-hidden="true"></span>
                      <span x-text="index.shortName"></span>
                    </button>
                  </template>
                </div>
              </div>
              <div x-show="step === 3" class="leading-[1.15]">
                <p>
                  Today, the <span x-text="selectedIndex?.name"></span
                  ><br />Index for Project “AAA” is
                  <span x-text="selectedIndex?.value"></span>.
                </p>
                <p>
                  An absolute index value of 1 or less indicates that the
                  asset<br class="group-data-compact:hidden" />
                  possesses a substantive value below the average.
                </p>
                <p class="font-bold text-[#ff6255]">
                  When the absolute index is 1 or less,<br />Kkaebi withholds
                  evaluation.
                </p>
                <p x-text="content.messages.otherItems"></p>
              </div>
              <div x-show="step === 4" class="px-[2.5cqw] leading-[1.15]">
                <p>
                  Today’s <span x-text="selectedIndex?.name"></span> Index is
                  <span x-text="selectedIndex?.value"></span>.
                </p>
                <p>This is above average.</p>
                <p
                  x-text="'The ' + selectedIndex?.name + ' Index of ' + selectedIndex?.value + ' falls within ' + selectedIndex?.tier + '.'"
                ></p>
                <p
                  class="text-[#386e2c]"
                  x-text="'Captain: ' + selectedIndex?.advice"
                ></p>
                <p x-text="content.messages.otherItems"></p>
              </div>
              <div x-show="step === 5 && !selected">
                <p x-text="content.messages.topics[0][0]"></p>
                <p>
                  <span x-text="content.messages.topics[1][0]"></span>
                  <br class="group-data-compact:hidden" />
                  <span x-text="content.messages.topics[1][1]"></span>
                </p>
              </div>
              <div id="explore-answer" x-show="step === 5 && selected" class="px-[4cqw] leading-[4.95cqw] group-data-compact:px-0 group-data-compact:leading-6">
                <template x-if="selected">
                  <div>
                    <p x-show="selected.title" class="font-bold" x-text="selected.title"></p>
                    <p x-show="selected.description && !selected.tips?.length" class="max-h-[24cqw] overflow-y-auto whitespace-pre-line [scrollbar-width:none]
                      [&::-webkit-scrollbar]:hidden group-data-compact:max-h-none
                      group-data-compact:overflow-visible" x-text="selectedDescription"></p>
                    <ul x-show="selected.tips?.length" class="mt-[1.5cqw] list-none [&>li+li]:mt-[0.7cqw]">
                      <template x-for="tip in selected.tips || []" :key="tip">
                        <li x-text="tip"></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>
            </div>

            <div class="contents group-data-compact:grid
              group-data-compact:grid-cols-[clamp(72px,27vw,104px)_minmax(0,1fr)] group-data-compact:items-start
              group-data-compact:gap-2 group-data-compact:px-2 group-data-compact:pt-4
              group-data-compact:min-h-[264px] group-data-[step=5]/popup:min-h-0">
              <div class="pointer-events-none absolute bottom-[3.3%] left-0 aspect-[574/720] w-1/4
                group-data-compact:relative group-data-compact:inset-auto
                group-data-compact:w-[clamp(72px,27vw,104px)]" aria-hidden="true">
                <picture>
                  <source media="(prefers-reduced-motion: reduce)" :srcset="characterPath + '-still.png'" />
                  <img class="absolute right-0 bottom-0 h-full w-auto max-w-none" :src="characterPath + '.gif'" alt="" />
                </picture>
              </div>

              <div
                x-show="step === 1 || step === 3 || step === 4"
                class="absolute top-[67.4%] left-(--bubble-x) flex w-[calc(240*var(--stage-unit))] -translate-x-1/2
                  justify-center gap-[3cqw] text-[3.09cqw] group-data-compact:relative
                  group-data-compact:inset-auto group-data-compact:w-auto group-data-compact:translate-x-0
                  group-data-compact:flex-wrap group-data-compact:items-center group-data-compact:justify-start
                  group-data-compact:gap-4 group-data-compact:pt-4 group-data-compact:text-base/6"
              >
                <button type="button" @click="showStep(2)" class="group/choice flex min-h-[max(44px,6cqw)] items-center gap-[2.5cqw] rounded-lg group-data-compact:min-h-11 group-data-compact:min-w-16">
                  <span class="size-[3.35cqw] rounded-full border-2 border-dotted border-[#00b5ff]
                    group-data-compact:size-6 group-data-compact:shrink-0 group-hover/choice:bg-sky-100" aria-hidden="true"></span>
                  <span x-text="content.buttons.yes"></span>
                </button>
                <button type="button" @click="answerNo()" class="group/choice flex min-h-[max(44px,6cqw)] items-center gap-[2.5cqw] rounded-lg group-data-compact:min-h-11 group-data-compact:min-w-16">
                  <span class="size-[3.35cqw] rounded-full border-2 border-dotted border-[#00b5ff]
                    group-data-compact:size-6 group-data-compact:shrink-0 group-hover/choice:bg-sky-100" aria-hidden="true"></span>
                  <span x-text="content.buttons.no"></span>
                </button>
              </div>
              <div x-show="step === 5 && selected" class="absolute top-[68%] right-[8%] left-[28%] flex justify-around gap-[3cqw] text-[2.8cqw]
                group-data-compact:relative group-data-compact:inset-auto group-data-compact:flex-col
                group-data-compact:items-start group-data-compact:justify-start group-data-compact:gap-2
                group-data-compact:pt-3 group-data-compact:text-base/6">
                <button class="min-h-11" type="button" @click="showStep(5)" x-text="content.buttons.continue"></button>
              </div>
            </div>
          </div>
          <div x-show="step === 5 && !selected" class="mx-[4%] mb-6 text-[18px] group-data-compact:text-base/6">
            <div class="absolute top-(--topics-y) left-[calc(var(--bubble-x)+var(--stage-offset)-80*var(--stage-unit))]
              w-[calc(300*var(--stage-unit))] group-data-compact:relative group-data-compact:inset-auto
              group-data-compact:w-auto">
              <template x-for="option in content.options" :key="option.id">
                <button class="flex min-h-11 items-center gap-3 text-left" type="button" @click="showStep(5, option.id)" aria-controls="explore-answer">
                  <span class="grid size-[30px] shrink-0 place-items-center rounded-full border-2 border-dotted
                    border-[#00b5ff]" x-text="option.symbol"></span>
                  <span x-text="option.label"></span>
                </button>
              </template>
            </div>
          </div>
        </section>
      </aside>
    </template>
  </body>
</html>
