<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wurizip · Project participation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./popup.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
  </head>
  <body class="min-h-dvh bg-white font-[Arial,sans-serif] text-black" x-data="wurizipPopup">
    <!-- Narrow or short viewports use a flowing layout; larger screens retain the reference composition. -->
    <template x-if="ready">
      <aside class="fixed bottom-[max(8px,env(safe-area-inset-bottom))] right-[max(8px,env(safe-area-inset-right))] z-50 w-[min(712px,calc(100vw-16px))] lg:bottom-4 lg:right-4 lg:w-[min(712px,calc(100vw-32px))] max-w-[calc(100vw-max(8px,env(safe-area-inset-left))-max(8px,env(safe-area-inset-right)))] [@media(max-height:500px)]:max-w-[min(520px,calc(100vw-32px))] [container-type:inline-size]" aria-label="Wurizip project assistant" @keydown.escape="closePopup()">
        <section x-ref="popupViewport" x-show="isOpen" class="relative aspect-[712/536] max-h-[calc(100dvh-max(16px,env(safe-area-inset-top))-max(16px,env(safe-area-inset-bottom)))] overflow-x-hidden overflow-y-auto overscroll-contain [@media(max-width:600px),(max-height:500px)]:aspect-auto [@media(max-width:600px),(max-height:500px)]:rounded-[32px] [@media(max-width:600px),(max-height:500px)]:bg-white [@media(max-width:600px),(max-height:500px)]:pb-14" role="region" aria-label="Project participation conversation">
          <div class="relative aspect-[712/536] [@media(max-width:600px),(max-height:500px)]:aspect-auto">
          <!-- A single outline joins the oval and tail without a seam. -->
          <svg class="pointer-events-none absolute inset-0 h-full w-full [@media(max-width:600px),(max-height:500px)]:hidden" viewBox="0 0 712 536" aria-hidden="true">
            <defs>
              <filter id="bubble-edge" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="8" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
              </filter>
            </defs>
            <path :d="bubblePath" fill="#b2e3fa" stroke="#008bd2" stroke-width="3" stroke-linejoin="round" filter="url(#bubble-edge)" />
            <path :d="bubblePath" fill="none" stroke="#008bd2" stroke-width="3.5" stroke-dasharray="1 3" stroke-linecap="round" />
          </svg>
          <span class="absolute left-[14.9%] top-[0.4%] z-10 flex size-[6cqw] [@media(max-width:600px),(max-height:500px)]:left-6 [@media(max-width:600px),(max-height:500px)]:top-2 [@media(max-width:600px),(max-height:500px)]:size-9 [@media(max-width:600px),(max-height:500px)]:text-2xl items-center justify-center rounded-full bg-[#83b34f] text-[4.2cqw] font-bold leading-none text-white" x-text="step" aria-label="Current step"></span>

          <!-- Start with an introduction; the reference result appears at step three. -->
          <div x-ref="stepTitle" tabindex="-1" class="absolute left-[8%] top-[5.2%] w-[87%] text-center text-[3.09cqw] leading-[4.95cqw] outline-none [@media(max-width:600px),(max-height:500px)]:relative [@media(max-width:600px),(max-height:500px)]:left-auto [@media(max-width:600px),(max-height:500px)]:top-auto [@media(max-width:600px),(max-height:500px)]:w-full [@media(max-width:600px),(max-height:500px)]:rounded-[36px] [@media(max-width:600px),(max-height:500px)]:border-[3px] [@media(max-width:600px),(max-height:500px)]:border-dotted [@media(max-width:600px),(max-height:500px)]:border-[#008bd2] [@media(max-width:600px),(max-height:500px)]:bg-[#b2e3fa] [@media(max-width:600px),(max-height:500px)]:px-[clamp(12px,4vw,20px)] [@media(max-width:600px),(max-height:500px)]:pb-6 [@media(max-width:600px),(max-height:500px)]:pt-14 [@media(max-width:600px),(max-height:500px)]:text-base [@media(max-width:600px),(max-height:500px)]:leading-6 [@media(max-width:600px),(max-height:500px)]:[&>div]:pt-0 [@media(max-width:600px),(max-height:500px)]:[&_p+p]:mt-3 [@media(max-width:600px),(max-height:500px)]:[&_p]:leading-6 [@media(max-width:600px),(max-height:500px)]:[&_ul]:text-base [@media(max-width:600px),(max-height:500px)]:[&_ul]:leading-6 [@media(max-width:600px),(max-height:500px)]:[&_ul]:space-y-3 [@media(max-width:600px),(max-height:500px)]:after:absolute [@media(max-width:600px),(max-height:500px)]:after:-bottom-3 [@media(max-width:600px),(max-height:500px)]:after:left-[calc(clamp(72px,27vw,104px)*0.6_-_2px)] [@media(max-width:600px),(max-height:500px)]:after:size-5 [@media(max-width:600px),(max-height:500px)]:after:rotate-45 [@media(max-width:600px),(max-height:500px)]:after:border-b-[3px] [@media(max-width:600px),(max-height:500px)]:after:border-r-[3px] [@media(max-width:600px),(max-height:500px)]:after:border-dotted [@media(max-width:600px),(max-height:500px)]:after:border-[#008bd2] [@media(max-width:600px),(max-height:500px)]:after:bg-[#b2e3fa] [@media(max-width:600px),(max-height:500px)]:after:content-['']" aria-live="polite" aria-atomic="true">
            <div x-show="step === 1 && !declined" class="pt-[8cqw]">
              <p>Hi, I’m Wurizip,<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> your Opustown companion.</p>
              <p class="mt-[2cqw]">Would you like to learn more<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> about the project you visited?</p>
            </div>
            <div x-show="step === 2 && !declined" class="pt-[3cqw]">
              <p>Let’s take a closer look at Project "AAA".</p>
              <p class="mt-[2cqw]">The participation index is one part<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> of the project’s information.</p>
              <p class="mt-[2cqw]">Would you like to see its index?</p>
            </div>
            <div x-show="step === 3 && !declined">
              <p>Today, the Participation<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> Index for Project "AAA" is 0.8922.</p>
              <p class="leading-[4.2cqw]">An absolute index value of 1 or less indicates that the asset<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> possesses a substantive value below the average.</p>
              <p class="mt-[1cqw] font-bold text-[#ff6255]">When the absolute index is 1 or less,<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> Kkaebi withholds evaluation.</p>
              <p>Would you like to know more about the actual value<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> of other items?</p>
            </div>
            <div x-show="step === 4 && !declined" class="pt-[5cqw]">
              <p>What would you like to explore next?</p>
              <p class="mt-[2cqw]">Choose an option below to learn more<br class="[@media(max-width:600px),(max-height:500px)]:hidden" /> about a project, its creator, or its details.</p>
            </div>
            <div x-show="step === 5 && !declined" class="px-[3cqw] pt-[2cqw]">
              <p class="font-bold" x-text="selected.title"></p>
              <ul class="mt-[1.5cqw] space-y-[1cqw] text-[2.65cqw] leading-[4cqw]"><template x-for="tip in selected.tips" :key="tip"><li x-text="tip"></li></template></ul>
            </div>
            <div x-show="declined" class="pt-[7cqw]"><p>No problem. Enjoy exploring!</p><p class="mt-[2cqw]">I’ll be right here if you need me.</p></div>
          </div>

          <!-- On phones the avatar and answers flow below the message. -->
          <div class="contents [@media(max-width:600px),(max-height:500px)]:grid [@media(max-width:600px),(max-height:500px)]:grid-cols-[clamp(72px,27vw,104px)_minmax(0,1fr)] [@media(max-width:600px),(max-height:500px)]:min-h-[264px] [@media(max-width:600px),(max-height:500px)]:items-start [@media(max-width:600px),(max-height:500px)]:gap-2 [@media(max-width:600px),(max-height:500px)]:px-2 [@media(max-width:600px),(max-height:500px)]:pt-4">
          <!-- Both clips share one stage and align to its right edge, matching their face and feet positions. -->
          <div class="pointer-events-none absolute bottom-[3.3%] left-0 aspect-[574/720] w-[25%] mix-blend-multiply [@media(max-width:600px),(max-height:500px)]:relative [@media(max-width:600px),(max-height:500px)]:bottom-auto [@media(max-width:600px),(max-height:500px)]:left-auto [@media(max-width:600px),(max-height:500px)]:w-[clamp(72px,27vw,104px)]" aria-hidden="true">
            <video x-ref="blink" x-show="step !== 1 || declined" class="absolute bottom-0 right-0 h-full w-auto max-w-none" muted playsinline loop preload="auto" tabindex="-1"><source src="./assets/Blinking eyes (online-video-cutter.com) (1).mp4" type="video/mp4" /></video>
            <video x-ref="wave" x-show="step === 1 && !declined" class="absolute bottom-0 right-0 h-full w-auto max-w-none" muted playsinline loop preload="auto" tabindex="-1"><source src="./assets/Waveing hand (online-video-cutter.com) (1).mp4" type="video/mp4" /></video>
          </div>

          <!-- Reference-style choice circles. Choosing an answer advances the flow. -->
          <div x-show="step <= 3 && !declined" class="absolute left-[32.5%] right-[24%] top-[67.4%] flex items-center justify-between text-[3.09cqw] [@media(max-width:600px),(max-height:500px)]:relative [@media(max-width:600px),(max-height:500px)]:left-auto [@media(max-width:600px),(max-height:500px)]:right-auto [@media(max-width:600px),(max-height:500px)]:top-auto [@media(max-width:600px),(max-height:500px)]:flex-wrap [@media(max-width:600px),(max-height:500px)]:justify-start [@media(max-width:600px),(max-height:500px)]:gap-x-4 [@media(max-width:600px),(max-height:500px)]:gap-y-2 [@media(max-width:600px),(max-height:500px)]:pt-4 [@media(max-width:600px),(max-height:500px)]:text-base">
            <button type="button" @click="advance()" class="group flex min-h-[max(44px,6cqw)] [@media(max-width:600px),(max-height:500px)]:min-h-11 [@media(max-width:600px),(max-height:500px)]:min-w-16 items-center gap-[2.5cqw] rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-500"><span class="size-[3.35cqw] [@media(max-width:600px),(max-height:500px)]:size-6 [@media(max-width:600px),(max-height:500px)]:shrink-0 rounded-full border-2 border-dotted border-[#00b5ff] group-hover:bg-sky-100" aria-hidden="true"></span>Yes</button>
            <button type="button" @click="decline()" class="group flex min-h-[max(44px,6cqw)] [@media(max-width:600px),(max-height:500px)]:min-h-11 [@media(max-width:600px),(max-height:500px)]:min-w-16 items-center gap-[2.5cqw] rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-500"><span class="size-[3.35cqw] [@media(max-width:600px),(max-height:500px)]:size-6 [@media(max-width:600px),(max-height:500px)]:shrink-0 rounded-full border-2 border-dotted border-[#00b5ff] group-hover:bg-sky-100" aria-hidden="true"></span>No</button>
          </div>
          <div x-show="step === 4 && !declined" class="absolute left-[25%] right-[4%] top-[66%] space-y-[1cqw] [@media(max-width:600px),(max-height:500px)]:relative [@media(max-width:600px),(max-height:500px)]:left-auto [@media(max-width:600px),(max-height:500px)]:right-auto [@media(max-width:600px),(max-height:500px)]:top-auto [@media(max-width:600px),(max-height:500px)]:space-y-2">
            <template x-for="option in options" :key="option.id"><button type="button" @click="choose(option.id)" class="flex min-h-[max(44px,6cqw)] items-center gap-[1.5cqw] text-left text-[2.6cqw] hover:text-sky-700 [@media(max-width:600px),(max-height:500px)]:min-h-11 [@media(max-width:600px),(max-height:500px)]:gap-2 [@media(max-width:600px),(max-height:500px)]:text-sm [@media(max-width:600px),(max-height:500px)]:leading-5 [@media(max-width:600px),(max-height:500px)]:w-full [@media(max-width:600px),(max-height:500px)]:min-w-0 [@media(max-width:600px),(max-height:500px)]:[&>span:last-child]:min-w-0 [@media(max-width:600px),(max-height:500px)]:[&>span:last-child]:break-words"><span class="flex size-[4cqw] [@media(max-width:600px),(max-height:500px)]:size-7 [@media(max-width:600px),(max-height:500px)]:shrink-0 [@media(max-width:600px),(max-height:500px)]:text-sm items-center justify-center rounded-full border-2 border-dotted border-[#00b5ff] text-[2.4cqw]" x-text="option.symbol"></span><span x-text="option.label"></span></button></template>
            <button type="button" @click="back()" class="min-h-11 [@media(max-width:600px),(max-height:500px)]:text-sm text-[2.2cqw] text-slate-500 hover:text-sky-700">← Back</button>
          </div>
          <div x-show="step === 5 || declined" class="absolute left-[28%] right-[12%] top-[68%] flex justify-around gap-[3cqw] text-[2.8cqw] [@media(max-width:600px),(max-height:500px)]:relative [@media(max-width:600px),(max-height:500px)]:left-auto [@media(max-width:600px),(max-height:500px)]:right-auto [@media(max-width:600px),(max-height:500px)]:top-auto [@media(max-width:600px),(max-height:500px)]:flex-col [@media(max-width:600px),(max-height:500px)]:gap-2 [@media(max-width:600px),(max-height:500px)]:text-base [@media(max-width:600px),(max-height:500px)]:[&>button]:min-h-11"><button type="button" @click="back()" class="min-h-11 rounded-lg px-[2cqw] py-[1cqw] hover:bg-sky-50">← Back</button><button type="button" @click="closePopup()" class="min-h-11 rounded-lg px-[2cqw] py-[1cqw] hover:bg-sky-50">Continue exploring</button></div>
          </div>
          </div>
        </section>
        <!-- Character-led launcher with a visible label and open/close indicator. -->
        <button x-ref="launcher" type="button" @click="isOpen ? closePopup() : openPopup()" class="group absolute bottom-[0.5cqw] right-0 flex max-w-full items-center gap-2.5 rounded-2xl border border-[#e4e9ec] bg-white py-1.5 pl-1.5 pr-2 text-[#263b49] shadow-[0_6px_22px_-6px_rgba(38,59,73,0.25)] transition duration-200 hover:border-[#83b34f] hover:shadow-[0_8px_24px_-6px_rgba(38,59,73,0.3)] active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-600 motion-reduce:transform-none" :aria-label="isOpen ? 'Minimize Wurizip' : 'Open Wurizip'" :aria-expanded="isOpen">
          <span class="size-10 shrink-0 overflow-hidden rounded-xl border border-[#ead9a1] bg-[#fff2c9]"><img src="./assets/wurizip-portrait.png" alt="" width="40" height="40" class="h-full w-full object-cover mix-blend-multiply" /></span>
          <span class="min-w-0 text-left"><span class="block text-[13px] font-bold leading-5" x-text="isOpen ? 'Wurizip is here' : 'Ask Wurizip'"></span><span class="block text-[10px] leading-4 text-slate-500" x-text="isOpen ? 'Tap to minimize' : 'Your project companion'"></span></span>
          <span class="ml-1 flex size-7 shrink-0 items-center justify-center rounded-full bg-[#ffda35] text-[#263b49] transition group-hover:bg-[#ffce16]" aria-hidden="true"><svg class="size-4 transition-transform motion-reduce:transition-none" :class="isOpen ? '' : 'rotate-180'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 5 5 5-5" /></svg></span>
        </button>
      </aside>
    </template>
  </body>
</html>
